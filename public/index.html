<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ersatzben desk</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600&display=swap');

      * {
        box-sizing: border-box;
      }

      :root {
        color-scheme: light;
        --paper: #fcfaf5;
        --ink: #2a2620;
        --muted: #837b6c;
        --faint: #a39a89;
        --rule: #e6e1d4;
        --accent: #38614a;
        --pin: #c08b1d;
        --pad: #fffdf4;
        --pad-rule: #ece5d2;
        font-family: 'Public Sans', -apple-system, sans-serif;
      }

      body {
        margin: 0;
        padding: 2rem 1.5rem 4rem;
        background: var(--paper);
        color: var(--ink);
        font-size: 14px;
        line-height: 1.5;
      }

      main {
        max-width: 1080px;
        margin: 0 auto;
      }

      /* ---------- header ---------- */

      header.site {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem 2rem;
        border-bottom: 2px solid var(--ink);
        padding-bottom: 0.75rem;
        margin-bottom: 0.5rem;
      }

      h1 {
        margin: 0;
        font-family: 'Newsreader', Georgia, serif;
        font-size: 2.1rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      h1 .dim {
        color: var(--faint);
        font-weight: 400;
        font-style: italic;
      }

      .quick-links {
        display: flex;
        gap: 0.25rem;
        align-items: center;
        flex-wrap: wrap;
      }

      .quick-link {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s;
      }

      .quick-link:hover {
        background: #efeadd;
      }

      .quick-link img {
        width: 18px;
        height: 18px;
        object-fit: contain;
        filter: saturate(0.85);
      }

      /* ---------- toolbar ---------- */

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.75rem;
        min-height: 30px;
      }

      #status {
        font-size: 12px;
        color: var(--muted);
        font-style: italic;
        font-family: 'Newsreader', Georgia, serif;
      }

      .toolbar-actions {
        display: flex;
        gap: 1rem;
      }

      .toolbar-actions[hidden] {
        display: none;
      }

      .text-btn {
        border: none;
        background: none;
        padding: 0.25rem 0;
        font-size: 12px;
        color: var(--faint);
        cursor: pointer;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 3px;
        font-family: inherit;
      }

      .text-btn:hover {
        color: var(--accent);
      }

      input[type='password'],
      input[type='text'] {
        padding: 0.35rem 0.5rem;
        border: 1px solid var(--rule);
        border-radius: 4px;
        background: #fff;
        color: var(--ink);
        font-size: 12px;
        font-family: inherit;
      }

      input:focus {
        outline: none;
        border-color: var(--accent);
      }

      button {
        padding: 0.35rem 0.7rem;
        border: 1px solid var(--rule);
        border-radius: 4px;
        background: #fff;
        color: var(--ink);
        font-size: 12px;
        font-family: inherit;
        font-weight: 500;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* ---------- login ---------- */

      .login {
        display: none;
        margin: 4rem auto 0;
        max-width: 340px;
        background: var(--pad);
        border: 1px solid var(--rule);
        border-radius: 3px;
        box-shadow: 0 1px 3px rgba(60, 50, 30, 0.08), 0 6px 16px rgba(60, 50, 30, 0.05);
        padding: 1.5rem 1.5rem 1.75rem;
        text-align: center;
      }

      .login.visible {
        display: block;
      }

      .login h2 {
        margin: 0 0 1rem;
        font-family: 'Newsreader', Georgia, serif;
        font-size: 1.3rem;
        font-weight: 600;
        font-style: italic;
      }

      .login form {
        display: flex;
        gap: 0.4rem;
        justify-content: center;
      }

      .login input {
        flex: 1;
      }

      .login-error {
        margin-top: 0.75rem;
        font-size: 12px;
        color: #a04030;
        min-height: 1em;
      }

      /* ---------- layout ---------- */

      .columns {
        display: none;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 3rem;
        align-items: start;
      }

      .columns.visible {
        display: grid;
      }

      /* ---------- repo list ---------- */

      ul.repos {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .repo-row {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        padding: 0.85rem 0;
        border-bottom: 1px solid var(--rule);
      }

      .pin-btn {
        border: none;
        background: none;
        align-self: start;
        padding: 0;
        margin-top: 3px;
        font-size: 15px;
        line-height: 1.4;
        color: var(--rule);
        cursor: pointer;
        text-align: left;
        transition: color 0.15s;
      }

      .repo-row:hover .pin-btn {
        color: var(--faint);
      }

      .pin-btn:hover {
        color: var(--pin);
        border-color: transparent;
      }

      .pin-btn.pinned,
      .repo-row:hover .pin-btn.pinned {
        color: var(--pin);
      }

      .repo-title-line {
        display: flex;
        align-items: baseline;
        gap: 0.6rem;
        flex-wrap: wrap;
      }

      .repo-name {
        font-family: 'Newsreader', Georgia, serif;
        font-size: 18px;
        font-weight: 600;
        color: var(--ink);
        text-decoration: none;
      }

      .repo-name:hover {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-thickness: 1px;
      }

      .tag {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        border: 1px solid var(--rule);
        border-radius: 3px;
        padding: 0 5px;
        line-height: 1.6;
      }

      .homepage-link {
        font-size: 12px;
        color: var(--accent);
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 3px;
        text-decoration-thickness: 1px;
      }

      .homepage-link:hover {
        text-decoration-style: solid;
      }

      .tag.private {
        color: #8a5a2b;
        border-color: #dcc9a8;
        background: #f7efdd;
      }

      .repo-desc {
        margin: 0.15rem 0 0.3rem;
        font-size: 13px;
        color: var(--ink);
        max-width: 60ch;
      }

      .repo-desc.empty {
        color: var(--faint);
        font-style: italic;
      }

      .readme-preview {
        margin: 0 0 0.35rem;
        font-size: 12px;
        line-height: 1.45;
        color: var(--muted);
        max-width: 60ch;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .meta {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        gap: 0.35rem 0;
        flex-wrap: wrap;
        align-items: center;
        font-variant-numeric: tabular-nums;
      }

      .meta > span + span::before {
        content: '·';
        margin: 0 0.5rem;
        color: var(--faint);
      }

      .lang-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: baseline;
        background: var(--faint);
      }

      /* ---------- to-do pad ---------- */

      aside.todo {
        position: sticky;
        top: 1.5rem;
        background: var(--pad);
        border: 1px solid var(--rule);
        border-radius: 3px;
        box-shadow: 0 1px 3px rgba(60, 50, 30, 0.08), 0 6px 16px rgba(60, 50, 30, 0.05);
        padding: 1rem 1.1rem 1.25rem;
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 27px,
          var(--pad-rule) 27px,
          var(--pad-rule) 28px
        );
        background-position: 0 8px;
      }

      aside.todo h2 {
        margin: 0 0 0.75rem;
        font-family: 'Newsreader', Georgia, serif;
        font-size: 1.25rem;
        font-weight: 600;
        font-style: italic;
      }

      .todo-add {
        display: flex;
        gap: 0.4rem;
        margin-bottom: 0.75rem;
      }

      .todo-add input {
        flex: 1;
        background: #fff;
      }

      ul.todo-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .todo-item {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        padding: 0;
        line-height: 28px;
        font-size: 13px;
      }

      .todo-item input[type='checkbox'] {
        accent-color: var(--accent);
        margin-top: 8px;
        cursor: pointer;
      }

      .todo-item label {
        flex: 1;
        cursor: pointer;
        overflow-wrap: anywhere;
      }

      .todo-item.done label {
        color: var(--faint);
        text-decoration: line-through;
      }

      .todo-del {
        border: none;
        background: none;
        color: var(--faint);
        font-size: 14px;
        cursor: pointer;
        padding: 0 2px;
        opacity: 0;
      }

      .todo-item:hover .todo-del {
        opacity: 1;
      }

      .todo-del:hover {
        color: #a04030;
        border-color: transparent;
      }

      .todo-empty {
        color: var(--faint);
        font-style: italic;
        font-size: 13px;
        line-height: 28px;
      }

      .todo-foot {
        margin-top: 0.75rem;
        font-size: 11px;
        color: var(--faint);
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }

      .todo-clear {
        border: none;
        background: none;
        padding: 0;
        font-size: 11px;
        color: var(--faint);
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
        cursor: pointer;
      }

      .todo-clear:hover {
        color: #a04030;
        border-color: transparent;
      }

      /* ---------- responsive ---------- */

      @media (max-width: 860px) {
        .columns.visible {
          grid-template-columns: 1fr;
          gap: 2rem;
        }

        aside.todo {
          position: static;
          order: -1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="site">
        <h1>ersatzben <span class="dim">/ desk</span></h1>
        <nav class="quick-links">
          <a href="https://web.whatsapp.com/" rel="noopener noreferrer" class="quick-link" title="WhatsApp">
            <img src="assets/favicons/whatsapp.svg" alt="WhatsApp">
          </a>
          <a href="https://mail.google.com/mail/u/0/#inbox" rel="noopener noreferrer" class="quick-link" title="Gmail">
            <img src="assets/favicons/gmail.png" alt="Gmail">
          </a>
          <a href="https://outlook.office.com/mail/0/?deeplink=mail%2F0%2F%3Fnlp%3D0" rel="noopener noreferrer" class="quick-link" title="Outlook">
            <img src="assets/favicons/outlook.png" alt="Outlook">
          </a>
          <a href="https://docs.google.com/document/u/0/" rel="noopener noreferrer" class="quick-link" title="Google Docs">
            <img src="assets/favicons/googledocs.svg" alt="Google Docs">
          </a>
          <a href="https://x.com/home" rel="noopener noreferrer" class="quick-link" title="X">
            <img src="assets/favicons/x.png" alt="X">
          </a>
          <a href="https://bsky.app/" rel="noopener noreferrer" class="quick-link" title="Bluesky">
            <img src="assets/favicons/bluesky.png" alt="Bluesky">
          </a>
          <a href="https://studio.youtube.com/" rel="noopener noreferrer" class="quick-link" title="YouTube Studio">
            <img src="assets/favicons/youtube.svg" alt="YouTube Studio">
          </a>
          <a href="https://chatgpt.com/" rel="noopener noreferrer" class="quick-link" title="ChatGPT">
            <img src="assets/favicons/chatgpt.png" alt="ChatGPT">
          </a>
          <a href="https://claude.ai/" rel="noopener noreferrer" class="quick-link" title="Claude">
            <img src="assets/favicons/claude.png" alt="Claude">
          </a>
        </nav>
      </header>

      <div class="toolbar">
        <div id="status">&nbsp;</div>
        <div class="toolbar-actions" id="toolbar-actions" hidden>
          <button type="button" class="text-btn" id="refresh-btn">refresh</button>
          <button type="button" class="text-btn" id="logout-btn">sign out</button>
        </div>
      </div>

      <section class="login" id="login">
        <h2>Who goes there?</h2>
        <form id="login-form">
          <input
            type="password"
            id="passphrase"
            placeholder="Passphrase"
            autocomplete="current-password"
            aria-label="Passphrase"
          />
          <button type="submit">Enter</button>
        </form>
        <div class="login-error" id="login-error"></div>
      </section>

      <div class="columns" id="columns">
        <section>
          <ul class="repos" id="repo-list"></ul>
        </section>

        <aside class="todo">
          <h2>To do</h2>
          <div class="todo-add">
            <input type="text" id="todo-input" placeholder="Add an item…" aria-label="New to-do item" />
            <button type="button" id="todo-add-btn">Add</button>
          </div>
          <ul class="todo-list" id="todo-list"></ul>
          <div class="todo-foot">
            <span id="todo-count"></span>
            <button type="button" class="todo-clear" id="todo-clear">clear done</button>
          </div>
        </aside>
      </div>
    </main>

    <script>
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('repo-list');
      const loginEl = document.getElementById('login');
      const columnsEl = document.getElementById('columns');
      const toolbarActionsEl = document.getElementById('toolbar-actions');

      let repos = [];
      let pins = [];
      let todos = [];
      let tokenPresent = false;

      function esc(value) {
        const div = document.createElement('div');
        div.textContent = value == null ? '' : String(value);
        return div.innerHTML;
      }

      function relativeDate(iso) {
        const then = new Date(iso);
        const seconds = Math.round((Date.now() - then.getTime()) / 1000);
        const units = [
          [60, 'second'],
          [60, 'minute'],
          [24, 'hour'],
          [7, 'day'],
          [4.348, 'week'],
          [12, 'month'],
          [Infinity, 'year'],
        ];
        let value = seconds;
        for (const [divisor, name] of units) {
          if (value < divisor) {
            const rounded = Math.max(1, Math.floor(value));
            return `${rounded} ${name}${rounded === 1 ? '' : 's'} ago`;
          }
          value /= divisor;
        }
      }

      function formatSize(kb) {
        if (kb < 1024) return `${kb} KB`;
        return `${(kb / 1024).toFixed(1)} MB`;
      }

      const LANG_COLORS = {
        JavaScript: '#d4b830',
        TypeScript: '#3178c6',
        Python: '#3572a5',
        HTML: '#e34c26',
        CSS: '#663399',
        SCSS: '#c6538c',
        Ruby: '#701516',
        Go: '#00add8',
        Rust: '#a0522d',
        Shell: '#89e051',
        Swift: '#f05138',
        'C#': '#178600',
        'C++': '#f34b7d',
        C: '#555555',
        Java: '#b07219',
        Kotlin: '#a97bff',
        PHP: '#4f5d95',
        'Jupyter Notebook': '#da5b0b',
        R: '#198ce7',
        Max: '#c4a79c',
        Astro: '#ff5a03',
      };

      // ---------- API ----------

      class AuthError extends Error {}

      async function api(path, options = {}) {
        const response = await fetch(path, {
          headers: options.body ? { 'Content-Type': 'application/json' } : {},
          ...options,
        });
        if (response.status === 401) {
          showLogin();
          throw new AuthError();
        }
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || `Request failed (${response.status}).`);
        }
        return data;
      }

      function showLogin() {
        loginEl.classList.add('visible');
        columnsEl.classList.remove('visible');
        toolbarActionsEl.hidden = true;
        statusEl.innerHTML = '&nbsp;';
        document.getElementById('passphrase').focus();
      }

      function showDesk() {
        loginEl.classList.remove('visible');
        columnsEl.classList.add('visible');
        toolbarActionsEl.hidden = false;
      }

      // ---------- repos ----------

      function metaLine(repo) {
        const parts = [];
        if (repo.language) {
          const color = LANG_COLORS[repo.language] || '#a39a89';
          parts.push(
            `<span><span class="lang-dot" style="background:${color}"></span>${esc(repo.language)}</span>`
          );
        }
        if (repo.stargazers_count > 0) {
          parts.push(`<span>${repo.stargazers_count} star${repo.stargazers_count === 1 ? '' : 's'}</span>`);
        }
        if (repo.forks_count > 0) {
          parts.push(`<span>${repo.forks_count} fork${repo.forks_count === 1 ? '' : 's'}</span>`);
        }
        if (repo.open_issues_count > 0) {
          parts.push(`<span>${repo.open_issues_count} open issue${repo.open_issues_count === 1 ? '' : 's'}</span>`);
        }
        parts.push(`<span>pushed ${relativeDate(repo.pushed_at || repo.updated_at)}</span>`);
        parts.push(`<span>created ${new Date(repo.created_at).getFullYear()}</span>`);
        parts.push(`<span>${formatSize(repo.size)}</span>`);
        return parts.join('');
      }

      function repoRow(repo, isPinned) {
        const tags = [];
        if (repo.private) tags.push('<span class="tag private">private</span>');
        if (repo.fork) tags.push('<span class="tag">fork</span>');
        if (repo.archived) tags.push('<span class="tag">archived</span>');

        const desc = repo.description
          ? `<p class="repo-desc">${esc(repo.description)}</p>`
          : `<p class="repo-desc empty">No description</p>`;

        const preview =
          repo.readme && repo.readme.length > 0
            ? `<p class="readme-preview">${repo.readme.map(esc).join('<br>')}</p>`
            : '';

        // Prefer the repo's Website field; fall back to its GitHub Pages URL
        // (which redirects if a custom domain is configured).
        let siteUrl = repo.homepage;
        if (!siteUrl && repo.has_pages) {
          siteUrl = `https://ersatzben.github.io/${repo.name}/`;
        }
        let homepage = '';
        if (siteUrl) {
          const display = siteUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');
          const href = /^https?:\/\//.test(siteUrl) ? siteUrl : `https://${siteUrl}`;
          homepage = `<a href="${esc(href)}" rel="noopener noreferrer" class="homepage-link">${esc(display)}&nbsp;↗</a>`;
        }

        return `
          <li class="repo-row">
            <button class="pin-btn ${isPinned ? 'pinned' : ''}" data-pin="${esc(repo.name)}"
              title="${isPinned ? 'Unpin repository' : 'Pin repository'}">${isPinned ? '★' : '☆'}</button>
            <div>
              <div class="repo-title-line">
                <a href="${esc(repo.html_url)}" rel="noopener noreferrer" class="repo-name">${esc(repo.name)}</a>
                ${tags.join('')}
                ${homepage}
              </div>
              ${desc}
              ${preview}
              <div class="meta">${metaLine(repo)}</div>
            </div>
          </li>
        `;
      }

      function renderRepos() {
        const pinned = repos.filter((repo) => pins.includes(repo.name));
        const rest = repos.filter((repo) => !pins.includes(repo.name));

        listEl.innerHTML = [
          ...pinned.map((repo) => repoRow(repo, true)),
          ...rest.map((repo) => repoRow(repo, false)),
        ].join('');

        if (!tokenPresent) {
          statusEl.textContent = 'No GitHub token set — public repos only.';
        } else {
          statusEl.innerHTML = '&nbsp;';
        }
      }

      listEl.addEventListener('click', (event) => {
        const btn = event.target.closest('[data-pin]');
        if (!btn) return;
        event.preventDefault();
        const name = btn.dataset.pin;
        pins = pins.includes(name) ? pins.filter((pin) => pin !== name) : [...pins, name];
        renderRepos();
        api('/api/pins', { method: 'PUT', body: JSON.stringify(pins) }).catch(() => {});
      });

      // ---------- to-dos ----------

      const todoListEl = document.getElementById('todo-list');
      const todoInput = document.getElementById('todo-input');

      function renderTodos() {
        if (todos.length === 0) {
          todoListEl.innerHTML = '<li class="todo-empty">Nothing on the list.</li>';
        } else {
          todoListEl.innerHTML = todos
            .map(
              (todo, i) => `
                <li class="todo-item ${todo.done ? 'done' : ''}">
                  <input type="checkbox" id="todo-${i}" data-toggle="${i}" ${todo.done ? 'checked' : ''} />
                  <label for="todo-${i}">${esc(todo.text)}</label>
                  <button class="todo-del" data-del="${i}" title="Remove">×</button>
                </li>
              `
            )
            .join('');
        }
        const open = todos.filter((todo) => !todo.done).length;
        document.getElementById('todo-count').textContent = todos.length === 0 ? '' : `${open} open`;
      }

      function saveTodos() {
        api('/api/todos', { method: 'PUT', body: JSON.stringify(todos) }).catch(() => {});
      }

      function addTodo() {
        const text = todoInput.value.trim();
        if (!text) return;
        todos.push({ text, done: false });
        todoInput.value = '';
        renderTodos();
        saveTodos();
        todoInput.focus();
      }

      document.getElementById('todo-add-btn').addEventListener('click', addTodo);
      todoInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') addTodo();
      });

      todoListEl.addEventListener('click', (event) => {
        const toggle = event.target.closest('[data-toggle]');
        const del = event.target.closest('[data-del]');
        if (toggle) {
          todos[Number(toggle.dataset.toggle)].done = toggle.checked;
          renderTodos();
          saveTodos();
        } else if (del) {
          todos.splice(Number(del.dataset.del), 1);
          renderTodos();
          saveTodos();
        }
      });

      document.getElementById('todo-clear').addEventListener('click', () => {
        todos = todos.filter((todo) => !todo.done);
        renderTodos();
        saveTodos();
      });

      // ---------- login / init ----------

      document.getElementById('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const errorEl = document.getElementById('login-error');
        errorEl.textContent = '';
        try {
          await api('/api/login', {
            method: 'POST',
            body: JSON.stringify({ passphrase: document.getElementById('passphrase').value }),
          });
          document.getElementById('passphrase').value = '';
          init();
        } catch (error) {
          errorEl.textContent = error instanceof AuthError ? 'Wrong passphrase.' : error.message;
        }
      });

      document.getElementById('logout-btn').addEventListener('click', async () => {
        await api('/api/logout', { method: 'POST' }).catch(() => {});
        showLogin();
      });

      document.getElementById('refresh-btn').addEventListener('click', () => init(true));

      async function init(fresh = false) {
        try {
          statusEl.textContent = 'Loading…';
          const [repoData, todoData, pinData] = await Promise.all([
            api(`/api/repos${fresh ? '?fresh=1' : ''}`),
            api('/api/todos'),
            api('/api/pins'),
          ]);
          repos = repoData.repos;
          tokenPresent = repoData.tokenPresent;
          todos = todoData;
          pins = pinData;
          showDesk();
          renderRepos();
          renderTodos();
        } catch (error) {
          if (error instanceof AuthError) return;
          statusEl.textContent = error.message;
        }
      }

      init();
    </script>
  </body>
</html>
