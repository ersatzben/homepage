<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ersatzben desk</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,600&family=Public+Sans:wght@400;500;600&display=swap');

      * {
        box-sizing: border-box;
      }

      :root {
        color-scheme: light;
        --paper: #f2eee4;
        --ink: #2a2620;
        --muted: #837b6c;
        --faint: #a39a89;
        --rule: #e6e1d4;
        --accent: #38614a;
        --pin: #c08b1d;
        --pad: #fffdf4;
        font-family: 'Public Sans', -apple-system, sans-serif;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-size: 14px;
        line-height: 1.5;
        overflow: hidden;
      }

      /* ---------- menu bar ---------- */

      #menubar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 44px;
        display: flex;
        align-items: center;
        gap: 1.25rem;
        padding: 0 1rem;
        background: var(--pad);
        border-bottom: 2px solid var(--ink);
        z-index: 5000;
      }

      .menu-title {
        font-family: 'Newsreader', Georgia, serif;
        font-size: 1.15rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .menu-title .dim {
        color: var(--faint);
        font-weight: 400;
        font-style: italic;
      }

      #status {
        font-size: 11px;
        color: var(--muted);
        font-style: italic;
        font-family: 'Newsreader', Georgia, serif;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }

      .quick-links {
        display: flex;
        gap: 0.1rem;
        align-items: center;
      }

      .quick-link {
        width: 28px;
        height: 28px;
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s;
      }

      .quick-link:hover {
        background: #efeadd;
      }

      .quick-link img {
        width: 16px;
        height: 16px;
        object-fit: contain;
        filter: saturate(0.85);
      }

      .menu-actions {
        display: flex;
        gap: 0.9rem;
      }

      .menu-actions[hidden] {
        display: none;
      }

      .text-btn {
        border: none;
        background: none;
        padding: 0.25rem 0;
        font-size: 12px;
        color: var(--faint);
        cursor: pointer;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 3px;
        font-family: inherit;
        white-space: nowrap;
      }

      .text-btn:hover {
        color: var(--accent);
      }

      /* ---------- desk ---------- */

      #desk {
        position: fixed;
        top: 44px;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
      }

      /* ---------- windows ---------- */

      .win {
        position: absolute;
        display: none;
        flex-direction: column;
        background: var(--pad);
        border: 1.5px solid var(--ink);
        border-radius: 3px;
        box-shadow: 3px 3px 0 rgba(42, 38, 32, 0.12);
        min-width: 260px;
        min-height: 160px;
      }

      body.authed .win {
        display: flex;
      }

      .win.front {
        box-shadow: 5px 5px 0 rgba(42, 38, 32, 0.18);
      }

      .win-title {
        position: relative;
        flex-shrink: 0;
        height: 30px;
        margin: 3px;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        border-bottom: 1px solid var(--rule);
      }

      /* Classic desktop: only the front window shows its title-bar pinstripes. */
      .win.front .win-title {
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 3px,
          var(--rule) 3px,
          var(--rule) 4px
        );
        background-position: 0 5px;
        background-size: 100% 20px;
        background-repeat: no-repeat;
      }

      .win-title:active {
        cursor: grabbing;
      }

      .win-title-text {
        position: absolute;
        left: 50%;
        top: 45%;
        transform: translate(-50%, -50%);
        background: var(--pad);
        padding: 0 12px;
        font-family: 'Newsreader', Georgia, serif;
        font-size: 15px;
        font-style: italic;
        font-weight: 600;
        white-space: nowrap;
      }

      .win-body {
        flex: 1;
        overflow: auto;
        padding: 0.5rem 1rem 1rem;
      }

      .win-resize {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 18px;
        height: 18px;
        cursor: nwse-resize;
        touch-action: none;
        background:
          linear-gradient(135deg, transparent 0 8px, var(--faint) 8px 9px, transparent 9px 12px, var(--faint) 12px 13px, transparent 13px);
      }

      /* ---------- login ---------- */

      .login {
        display: none;
        position: absolute;
        left: 50%;
        top: 34%;
        transform: translate(-50%, -50%);
        width: min(340px, calc(100vw - 3rem));
        background: var(--pad);
        border: 1.5px solid var(--ink);
        border-radius: 3px;
        box-shadow: 5px 5px 0 rgba(42, 38, 32, 0.18);
        padding: 1.5rem 1.5rem 1.75rem;
        text-align: center;
      }

      .login.visible {
        display: block;
      }

      .login h2 {
        margin: 0 0 1rem;
        font-family: 'Newsreader', Georgia, serif;
        font-size: 1.3rem;
        font-weight: 600;
        font-style: italic;
      }

      .login form {
        display: flex;
        gap: 0.4rem;
        justify-content: center;
      }

      .login input {
        flex: 1;
        min-width: 0;
      }

      .login-error {
        margin-top: 0.75rem;
        font-size: 12px;
        color: #a04030;
        min-height: 1em;
      }

      /* ---------- shared form bits ---------- */

      input[type='password'],
      input[type='text'] {
        padding: 0.35rem 0.5rem;
        border: 1px solid var(--rule);
        border-radius: 4px;
        background: #fff;
        color: var(--ink);
        font-size: 12px;
        font-family: inherit;
      }

      input:focus {
        outline: none;
        border-color: var(--accent);
      }

      button {
        padding: 0.35rem 0.7rem;
        border: 1px solid var(--rule);
        border-radius: 4px;
        background: #fff;
        color: var(--ink);
        font-size: 12px;
        font-family: inherit;
        font-weight: 500;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* ---------- repo list ---------- */

      ul.repos {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .repo-row {
        display: grid;
        grid-template-columns: 26px minmax(0, 1fr);
        padding: 0.7rem 0;
        border-bottom: 1px solid var(--rule);
      }

      .repo-row:last-child {
        border-bottom: none;
      }

      .pin-btn {
        border: none;
        background: none;
        align-self: start;
        padding: 0;
        margin-top: 3px;
        font-size: 15px;
        line-height: 1.4;
        color: var(--rule);
        cursor: pointer;
        text-align: left;
        transition: color 0.15s;
      }

      .repo-row:hover .pin-btn {
        color: var(--faint);
      }

      .pin-btn:hover {
        color: var(--pin);
        border-color: transparent;
      }

      .pin-btn.pinned,
      .repo-row:hover .pin-btn.pinned {
        color: var(--pin);
      }

      .repo-title-line {
        display: flex;
        align-items: baseline;
        gap: 0.6rem;
        flex-wrap: wrap;
      }

      .repo-name {
        font-family: 'Newsreader', Georgia, serif;
        font-size: 17px;
        font-weight: 600;
        color: var(--ink);
        text-decoration: none;
      }

      .repo-name:hover {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-thickness: 1px;
      }

      .homepage-link {
        font-size: 12px;
        color: var(--accent);
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 3px;
        text-decoration-thickness: 1px;
      }

      .homepage-link:hover {
        text-decoration-style: solid;
      }

      .tag {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        border: 1px solid var(--rule);
        border-radius: 3px;
        padding: 0 5px;
        line-height: 1.6;
      }

      .tag.private {
        color: #8a5a2b;
        border-color: #dcc9a8;
        background: #f7efdd;
      }

      .repo-desc {
        margin: 0.15rem 0 0.3rem;
        font-size: 13px;
        color: var(--ink);
        max-width: 60ch;
      }

      .repo-desc.empty {
        color: var(--faint);
        font-style: italic;
      }

      .readme-preview {
        margin: 0 0 0.35rem;
        font-size: 12px;
        line-height: 1.45;
        color: var(--muted);
        max-width: 60ch;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .meta {
        font-size: 11.5px;
        color: var(--muted);
        display: flex;
        gap: 0.35rem 0;
        flex-wrap: wrap;
        align-items: center;
        font-variant-numeric: tabular-nums;
      }

      .meta > span + span::before {
        content: '·';
        margin: 0 0.45rem;
        color: var(--faint);
      }

      .lang-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: baseline;
        background: var(--faint);
      }

      /* ---------- lists ---------- */

      .todo-add {
        display: flex;
        gap: 0.4rem;
        margin-bottom: 0.6rem;
      }

      .todo-add input {
        flex: 1;
        min-width: 0;
        background: #fff;
      }

      ul.todo-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .todo-item {
        display: flex;
        align-items: flex-start;
        gap: 0.4rem;
        padding: 0.25rem 0;
        line-height: 1.5;
        font-size: 13px;
      }

      .todo-item.dragging {
        opacity: 0.4;
      }

      .todo-drag {
        color: var(--faint);
        cursor: grab;
        opacity: 0;
        user-select: none;
        letter-spacing: -1px;
      }

      .todo-item:hover .todo-drag {
        opacity: 1;
      }

      .todo-item input[type='checkbox'] {
        accent-color: var(--accent);
        margin-top: 2px;
        cursor: pointer;
      }

      .todo-item label {
        flex: 1;
        cursor: pointer;
        overflow-wrap: anywhere;
      }

      .todo-item.done label {
        color: var(--faint);
        text-decoration: line-through;
      }

      .todo-del {
        border: none;
        background: none;
        color: var(--faint);
        font-size: 14px;
        cursor: pointer;
        padding: 0 2px;
        opacity: 0;
      }

      .todo-item:hover .todo-del {
        opacity: 1;
      }

      .todo-del:hover {
        color: #a04030;
        border-color: transparent;
      }

      .todo-empty {
        color: var(--faint);
        font-style: italic;
        font-size: 13px;
        padding: 0.25rem 0;
      }

      .todo-foot {
        margin-top: 0.6rem;
        font-size: 11px;
        color: var(--faint);
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }

      .todo-clear {
        border: none;
        background: none;
        padding: 0;
        font-size: 11px;
        color: var(--faint);
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
        cursor: pointer;
      }

      .todo-clear:hover {
        color: #a04030;
        border-color: transparent;
      }

      /* ---------- clock & weather ---------- */

      .clock-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 0.15rem;
        padding: 0.75rem 1rem 1rem;
      }

      .clock-time {
        font-family: 'Newsreader', Georgia, serif;
        font-size: clamp(34px, 18cqw, 56px);
        font-weight: 500;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
      }

      .clock-win .win-body {
        container-type: inline-size;
      }

      .clock-date {
        font-family: 'Newsreader', Georgia, serif;
        font-style: italic;
        font-size: 14px;
        color: var(--muted);
      }

      .clock-rule {
        width: 60px;
        border: none;
        border-top: 1px solid var(--rule);
        margin: 0.6rem 0;
      }

      .weather-now {
        font-size: 15px;
      }

      .weather-now .temp {
        font-family: 'Newsreader', Georgia, serif;
        font-weight: 600;
        font-size: 19px;
        margin-right: 0.35rem;
      }

      .weather-range {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .weather-now.unavailable {
        color: var(--faint);
        font-style: italic;
        font-size: 13px;
      }

      .rain-chart {
        width: 100%;
        margin-top: 0.7rem;
      }

      .rain-chart[hidden] {
        display: none;
      }

      .rain-chart svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .rain-caption {
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        margin-top: 0.2rem;
      }

      /* ---------- small screens: stack the windows ---------- */

      @media (max-width: 860px) {
        body {
          overflow: auto;
        }

        #menubar {
          position: sticky;
          height: auto;
          flex-wrap: wrap;
          padding: 0.5rem 1rem;
          gap: 0.5rem 1.25rem;
        }

        #status {
          flex-basis: 100%;
          order: 10;
        }

        #desk {
          position: static;
          overflow: visible;
          padding: 1rem;
        }

        .win {
          position: static !important;
          width: auto !important;
          height: auto !important;
          margin-bottom: 1rem;
        }

        .win-title {
          cursor: default;
        }

        .win-body {
          max-height: 70vh;
        }

        .win-resize {
          display: none;
        }

        .login {
          position: static;
          transform: none;
          margin: 4rem auto 0;
        }
      }
    </style>
  </head>
  <body>
    <header id="menubar">
      <span class="menu-title">ersatzben <span class="dim">/ desk</span></span>
      <div id="status">&nbsp;</div>
      <nav class="quick-links">

          <img src="assets/favicons/whatsapp.svg" alt="WhatsApp">

        </a>
        <a href="https://docs.google.com/document/u/0/" rel="noopener noreferrer" class="quick-link" title="Google Docs">

        </a>
        <a href="https://x.com/home" rel="noopener noreferrer" class="quick-link" title="X">

        <a href="https://bsky.app/" rel="noopener noreferrer" class="quick-link" title="Bluesky">

      <div class="menu-actions" id="toolbar-actions" hidden>

    <div id="desk">
      <section class="login" id="login">
        <h2>Who goes there?</h2>
        <form id="login-form">
          <input
            type="password"
            id="passphrase"
            placeholder="Passphrase"

          <div class="todo-add">

            <button type="button" class="todo-clear">clear done</button>
          </div>
        </div>
        <div class="win-resize"></div>
      </section>

      <section class="win list-win" data-box="writing" data-list="writing">
        <div class="win-title"><span class="win-title-text">Writing ideas</span></div>
        <div class="win-body">
          <div class="todo-add">
            <input type="text" class="todo-input" placeholder="Add an idea…" aria-label="New idea" />
            <button type="button" class="todo-add-btn">Add</button>
          </div>
          <ul class="todo-list"></ul>
          <div class="todo-foot">
            <span class="todo-count"></span>
            <button type="button" class="todo-clear">clear done</button>

        <div class="win-resize"></div>
      </section>

      <section class="win clock-win" data-box="clock">
        <div class="win-title"><span class="win-title-text">Outside</span></div>

          <div class="clock-date" id="clock-date"></div>

          <div class="weather-now" id="weather-now">Fetching weather…</div>

      <section class="win list-win" data-box="today" data-list="today">
        <div class="win-title"><span class="win-title-text">Today</span></div>
        <div class="win-body">
          <div class="todo-add">
            <input type="text" class="todo-input" placeholder="Add an item…" aria-label="New item" />
            <button type="button" class="todo-add-btn">Add</button>
          </div>
          <ul class="todo-list"></ul>
          <div class="todo-foot">
            <span class="todo-count"></span>
            <button type="button" class="todo-clear">clear done</button>
          </div>
        </div>
        <div class="win-resize"></div>
      </section>
    </div>

    <script>
      const statusEl = document.getElementById('status');
      const repoListEl = document.getElementById('repo-list');
      const loginEl = document.getElementById('login');
      const toolbarActionsEl = document.getElementById('toolbar-actions');
      const deskEl = document.getElementById('desk');

      let repos = [];
      let pins = [];
      let lists = { todo: [], writing: [], today: [] };
      let tokenPresent = false;

      function esc(value) {
        const div = document.createElement('div');
        div.textContent = value == null ? '' : String(value);
        return div.innerHTML;
      }

      function relativeDate(iso) {
        const then = new Date(iso);
        const seconds = Math.round((Date.now() - then.getTime()) / 1000);
        const units = [
          [60, 'second'],
          [60, 'minute'],
          [24, 'hour'],
          [7, 'day'],
          [4.348, 'week'],
          [12, 'month'],
          [Infinity, 'year'],
        ];
        let value = seconds;
        for (const [divisor, name] of units) {
          if (value < divisor) {
            const rounded = Math.max(1, Math.floor(value));
            return `${rounded} ${name}${rounded === 1 ? '' : 's'} ago`;
          }
          value /= divisor;
        }
      }

      function formatSize(kb) {
        if (kb < 1024) return `${kb} KB`;
        return `${(kb / 1024).toFixed(1)} MB`;
      }

      const LANG_COLORS = {
        JavaScript: '#d4b830',
        TypeScript: '#3178c6',
        Python: '#3572a5',
        HTML: '#e34c26',
        CSS: '#663399',
        SCSS: '#c6538c',
        Ruby: '#701516',
        Go: '#00add8',
        Rust: '#a0522d',
        Shell: '#89e051',
        Swift: '#f05138',
        'C#': '#178600',
        'C++': '#f34b7d',
        C: '#555555',
        Java: '#b07219',
        Kotlin: '#a97bff',
        PHP: '#4f5d95',
        'Jupyter Notebook': '#da5b0b',
        R: '#198ce7',
        Max: '#c4a79c',
        Astro: '#ff5a03',
      };

      // ---------- API ----------

      class AuthError extends Error {}

      async function api(path, options = {}) {
        const response = await fetch(path, {
          headers: options.body ? { 'Content-Type': 'application/json' } : {},
          ...options,
        });
        if (response.status === 401) {
          showLogin();
          throw new AuthError();
        }
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || `Request failed (${response.status}).`);
        }
        return data;
      }

      function showLogin() {
        loginEl.classList.add('visible');
        document.body.classList.remove('authed');
        toolbarActionsEl.hidden = true;
        statusEl.innerHTML = '&nbsp;';
        document.getElementById('passphrase').focus();
      }

      function showDesk() {
        loginEl.classList.remove('visible');
        document.body.classList.add('authed');
        toolbarActionsEl.hidden = false;
      }

      // ---------- windows ----------

      const DEFAULT_LAYOUT = {
        repos: { x: 20, y: 20, w: 640, h: 0, z: 1 },
        todo: { x: 690, y: 20, w: 340, h: 300, z: 2 },
        writing: { x: 690, y: 340, w: 340, h: 300, z: 3 },
        today: { x: 1050, y: 20, w: 340, h: 300, z: 4 },
        clock: { x: 1050, y: 340, w: 340, h: 330, z: 5 },
      };

      let layout = {};
      let topZ = 10;
      const winEls = {};

      // Invisible 10px grid: positions and sizes always land on it.
      const snap = (v) => Math.round(v / 10) * 10;

      function clampBox(box) {
        const deskW = deskEl.clientWidth;
        const deskH = deskEl.clientHeight;
        const b = { ...box };
        b.w = Math.max(260, Math.min(snap(b.w), deskW));
        b.h = Math.max(160, Math.min(snap(b.h), deskH));
        b.x = Math.max(0, Math.min(snap(b.x), deskW - 100));
        b.y = Math.max(0, Math.min(snap(b.y), deskH - 60));
        return b;
      }

      function applyLayout() {
        const deskH = deskEl.clientHeight;
        for (const [id, el] of Object.entries(winEls)) {
          const fallback = { ...DEFAULT_LAYOUT[id] };
          if (id === 'repos' && !fallback.h) fallback.h = Math.max(300, deskH - 48);
          const box = clampBox(layout[id] || fallback);
          layout[id] = box;
          el.style.left = `${box.x}px`;
          el.style.top = `${box.y}px`;
          el.style.width = `${box.w}px`;
          el.style.height = `${box.h}px`;
          el.style.zIndex = box.z;
          topZ = Math.max(topZ, box.z);
        }
        markFront();
      }

      function markFront() {
        let frontEl = null;
        let best = -Infinity;
        for (const [id, el] of Object.entries(winEls)) {
          el.classList.remove('front');
          if ((layout[id]?.z || 0) > best) {
            best = layout[id]?.z || 0;
            frontEl = el;
          }
        }
        if (frontEl) frontEl.classList.add('front');
      }

      let layoutTimer = null;
      function saveLayout() {
        clearTimeout(layoutTimer);
        layoutTimer = setTimeout(() => {
          api('/api/layout', { method: 'PUT', body: JSON.stringify(layout) }).catch(() => {});
        }, 500);
      }

      function bringToFront(id) {
        if (!layout[id]) return;
        if (layout[id].z !== topZ) {
          layout[id].z = ++topZ;
          winEls[id].style.zIndex = topZ;
          markFront();
          saveLayout();
        }
      }

      const isMobile = () => window.matchMedia('(max-width: 860px)').matches;

      function setupWindow(el) {
        const id = el.dataset.box;
        winEls[id] = el;

        el.addEventListener('pointerdown', () => bringToFront(id));

        const title = el.querySelector('.win-title');
        title.addEventListener('pointerdown', (event) => {
          if (isMobile() || event.button !== 0) return;
          event.preventDefault();
          const startX = event.clientX;
          const startY = event.clientY;
          const orig = { ...layout[id] };
          const move = (e) => {
            layout[id] = clampBox({
              ...layout[id],
              x: orig.x + (e.clientX - startX),
              y: orig.y + (e.clientY - startY),
            });
            el.style.left = `${layout[id].x}px`;
            el.style.top = `${layout[id].y}px`;
          };
          const up = () => {
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', up);
            saveLayout();
          };
          window.addEventListener('pointermove', move);
          window.addEventListener('pointerup', up);
        });

        const resize = el.querySelector('.win-resize');
        resize.addEventListener('pointerdown', (event) => {
          if (isMobile() || event.button !== 0) return;
          event.preventDefault();
          event.stopPropagation();
          bringToFront(id);
          const startX = event.clientX;
          const startY = event.clientY;
          const orig = { ...layout[id] };
          const move = (e) => {
            layout[id] = clampBox({
              ...layout[id],
              w: orig.w + (e.clientX - startX),
              h: orig.h + (e.clientY - startY),
            });
            el.style.width = `${layout[id].w}px`;
            el.style.height = `${layout[id].h}px`;
          };
          const up = () => {
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', up);
            saveLayout();
          };
          window.addEventListener('pointermove', move);
          window.addEventListener('pointerup', up);
        });
      }

      window.addEventListener('resize', () => {
        if (!isMobile()) applyLayout();
      });

      // ---------- repos ----------

      function metaLine(repo) {
        const parts = [];
        if (repo.language) {
          const color = LANG_COLORS[repo.language] || '#a39a89';
          parts.push(
            `<span><span class="lang-dot" style="background:${color}"></span>${esc(repo.language)}</span>`
          );
        }
        if (repo.stargazers_count > 0) {
          parts.push(`<span>${repo.stargazers_count} star${repo.stargazers_count === 1 ? '' : 's'}</span>`);
        }
        if (repo.forks_count > 0) {
          parts.push(`<span>${repo.forks_count} fork${repo.forks_count === 1 ? '' : 's'}</span>`);
        }
        if (repo.open_issues_count > 0) {
          parts.push(`<span>${repo.open_issues_count} open issue${repo.open_issues_count === 1 ? '' : 's'}</span>`);
        }
        parts.push(`<span>pushed ${relativeDate(repo.pushed_at || repo.updated_at)}</span>`);
        parts.push(`<span>created ${new Date(repo.created_at).getFullYear()}</span>`);
        parts.push(`<span>${formatSize(repo.size)}</span>`);
        return parts.join('');
      }

      function repoRow(repo, isPinned) {
        const tags = [];
        if (repo.private) tags.push('<span class="tag private">private</span>');
        if (repo.fork) tags.push('<span class="tag">fork</span>');
        if (repo.archived) tags.push('<span class="tag">archived</span>');

        const desc = repo.description
          ? `<p class="repo-desc">${esc(repo.description)}</p>`
          : `<p class="repo-desc empty">No description</p>`;

        const preview =
          repo.readme && repo.readme.length > 0
            ? `<p class="readme-preview">${repo.readme.map(esc).join('<br>')}</p>`
            : '';

        // Prefer the repo's Website field, then the Pages config (which knows
        // custom domains), then the predictable github.io URL.
        let siteUrl = repo.homepage || repo.pages_url;
        if (!siteUrl && repo.has_pages) {
          siteUrl = `https://ersatzben.github.io/${repo.name}/`;
        }
        let homepage = '';
        if (siteUrl) {
          const display = siteUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');
          const href = /^https?:\/\//.test(siteUrl) ? siteUrl : `https://${siteUrl}`;
          homepage = `<a href="${esc(href)}" rel="noopener noreferrer" class="homepage-link">${esc(display)}&nbsp;↗</a>`;
        }

        return `
          <li class="repo-row">
            <button class="pin-btn ${isPinned ? 'pinned' : ''}" data-pin="${esc(repo.name)}"
              title="${isPinned ? 'Unpin repository' : 'Pin repository'}">${isPinned ? '★' : '☆'}</button>
            <div>
              <div class="repo-title-line">
                <a href="${esc(repo.html_url)}" rel="noopener noreferrer" class="repo-name">${esc(repo.name)}</a>
                ${tags.join('')}
                ${homepage}
              </div>
              ${desc}
              ${preview}
              <div class="meta">${metaLine(repo)}</div>
            </div>
          </li>
        `;
      }

      function renderRepos() {
        const pinned = repos.filter((repo) => pins.includes(repo.name));
        const rest = repos.filter((repo) => !pins.includes(repo.name));

        repoListEl.innerHTML = [
          ...pinned.map((repo) => repoRow(repo, true)),
          ...rest.map((repo) => repoRow(repo, false)),
        ].join('');

        if (!tokenPresent) {
          statusEl.textContent = 'No GitHub token set — public repos only.';
        } else {
          statusEl.innerHTML = '&nbsp;';
        }
      }

      repoListEl.addEventListener('click', (event) => {
        const btn = event.target.closest('[data-pin]');
        if (!btn) return;
        event.preventDefault();
        const name = btn.dataset.pin;
        pins = pins.includes(name) ? pins.filter((pin) => pin !== name) : [...pins, name];
        renderRepos();
        api('/api/pins', { method: 'PUT', body: JSON.stringify(pins) }).catch(() => {});
      });

      // ---------- lists ----------

      const listRenderers = {};

      function setupList(boxEl) {
        const id = boxEl.dataset.list;
        const listEl = boxEl.querySelector('.todo-list');
        const input = boxEl.querySelector('.todo-input');
        const countEl = boxEl.querySelector('.todo-count');

        function save() {
          api(`/api/lists/${id}`, { method: 'PUT', body: JSON.stringify(lists[id]) }).catch(() => {});
        }

        function render() {
          const items = lists[id];
          if (items.length === 0) {
            listEl.innerHTML = '<li class="todo-empty">Nothing on the list.</li>';
          } else {
            listEl.innerHTML = items
              .map(
                (todo, i) => `
                  <li class="todo-item ${todo.done ? 'done' : ''}" draggable="true" data-index="${i}">
                    <span class="todo-drag" title="Drag to reorder">⠿</span>
                    <input type="checkbox" id="todo-${id}-${i}" data-toggle="${i}" ${todo.done ? 'checked' : ''} />
                    <label for="todo-${id}-${i}">${esc(todo.text)}</label>
                    <button class="todo-del" data-del="${i}" title="Remove">×</button>
                  </li>
                `
              )
              .join('');
          }
          const open = items.filter((todo) => !todo.done).length;
          countEl.textContent = items.length === 0 ? '' : `${open} open`;
        }
        listRenderers[id] = render;

        function add() {
          const text = input.value.trim();
          if (!text) return;
          lists[id].push({ text, done: false });
          input.value = '';
          render();
          save();
          input.focus();
        }

        boxEl.querySelector('.todo-add-btn').addEventListener('click', add);
        input.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') add();
        });

        listEl.addEventListener('click', (event) => {
          const toggle = event.target.closest('[data-toggle]');
          const del = event.target.closest('[data-del]');
          if (toggle) {
            lists[id][Number(toggle.dataset.toggle)].done = toggle.checked;
            render();
            save();
          } else if (del) {
            lists[id].splice(Number(del.dataset.del), 1);
            render();
            save();
          }
        });

        boxEl.querySelector('.todo-clear').addEventListener('click', () => {
          lists[id] = lists[id].filter((todo) => !todo.done);
          render();
          save();
        });

        // Drag to reorder: move the dragged row live as the pointer passes row
        // midpoints, then rebuild the list from DOM order on release.
        let dragEl = null;

        listEl.addEventListener('dragstart', (event) => {
          const item = event.target.closest('.todo-item');
          if (!item) return;
          dragEl = item;
          item.classList.add('dragging');
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', '');
        });

        listEl.addEventListener('dragover', (event) => {
          if (!dragEl) return;
          event.preventDefault();
          const over = event.target.closest('.todo-item');
          if (!over || over === dragEl) return;
          const rect = over.getBoundingClientRect();
          const before = event.clientY < rect.top + rect.height / 2;
          listEl.insertBefore(dragEl, before ? over : over.nextSibling);
        });

        listEl.addEventListener('dragend', () => {
          if (!dragEl) return;
          dragEl.classList.remove('dragging');
          dragEl = null;
          const order = [...listEl.querySelectorAll('.todo-item')].map((el) =>
            Number(el.dataset.index)
          );
          lists[id] = order.map((i) => lists[id][i]);
          render();
          save();
        });
      }

      function renderLists() {
        for (const render of Object.values(listRenderers)) render();
      }

      // ---------- clock & weather ----------

      // Open-Meteo, no key needed. London; adjust coordinates to move the desk.
      const WEATHER_URL =
        'https://api.open-meteo.com/v1/forecast?latitude=51.5072&longitude=-0.1276' +
        '&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min' +
        '&minutely_15=precipitation&forecast_minutely_15=96' +
        '&hourly=precipitation_probability&forecast_days=2&timezone=auto';

      const WMO_CODES = {
        0: 'Clear',
        1: 'Mostly clear',
        2: 'Partly cloudy',
        3: 'Overcast',
        45: 'Fog',
        48: 'Freezing fog',
        51: 'Light drizzle',
        53: 'Drizzle',
        55: 'Heavy drizzle',
        56: 'Freezing drizzle',
        57: 'Freezing drizzle',
        61: 'Light rain',
        63: 'Rain',
        65: 'Heavy rain',
        66: 'Freezing rain',
        67: 'Freezing rain',
        71: 'Light snow',
        73: 'Snow',
        75: 'Heavy snow',
        77: 'Snow grains',
        80: 'Light showers',
        81: 'Showers',
        82: 'Heavy showers',
        85: 'Snow showers',
        86: 'Snow showers',
        95: 'Thunderstorm',
        96: 'Thunderstorm',
        99: 'Thunderstorm',
      };

      function tickClock() {
        const now = new Date();
        document.getElementById('clock-time').textContent = now.toLocaleTimeString('en-GB', {
          hour: '2-digit',
          minute: '2-digit',
        });
        document.getElementById('clock-date').textContent = now.toLocaleDateString('en-GB', {
          weekday: 'long',
          day: 'numeric',
          month: 'long',
        });
      }

      // 48 bars of 15-minutely rain over the next 12 h, with the hourly rain
      // probability as a pale wash behind them.
      function renderRainChart(data) {
        const chartEl = document.getElementById('rain-chart');
        const captionEl = document.getElementById('rain-caption');
        try {
          const now = Date.now();
          const m = data.minutely_15;
          const start = m.time.findIndex((t) => new Date(t).getTime() > now - 15 * 60 * 1000);
          if (start === -1) throw new Error();
          const amounts = m.precipitation.slice(start, start + 48).map((v) => v ?? 0);
          if (amounts.length < 8) throw new Error();

          const h = data.hourly;
          const hStart = h.time.findIndex((t) => new Date(t).getTime() > now - 60 * 60 * 1000);
          const probs =
            hStart === -1
              ? []
              : h.precipitation_probability.slice(hStart, hStart + 12).map((v) => v ?? 0);

          const W = 480;
          const H = 48;
          const maxA = Math.max(0.5, ...amounts);
          let svg = `<svg viewBox="0 0 ${W} 62" xmlns="http://www.w3.org/2000/svg" aria-label="Rain forecast, next 12 hours">`;
          probs.forEach((p, i) => {
            const barH = (p / 100) * H;
            if (barH > 0) {
              svg += `<rect x="${i * 40}" y="${H - barH}" width="40" height="${barH}" fill="var(--rule)" opacity="0.55"/>`;
            }
          });
          amounts.forEach((a, i) => {
            const barH = Math.min(H, (a / maxA) * H);
            if (barH > 0) {
              svg += `<rect x="${i * 10 + 1.5}" y="${H - Math.max(2, barH)}" width="7" height="${Math.max(2, barH)}" rx="1" fill="var(--accent)"/>`;
            }
          });
          svg += `<line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--rule)" stroke-width="1"/>`;
          const labels = [
            ['now', 1, 'start'],
            ['+3h', 120, 'middle'],
            ['+6h', 240, 'middle'],
            ['+9h', 360, 'middle'],
            ['+12h', 479, 'end'],
          ];
          for (const [text, x, anchor] of labels) {
            svg += `<text x="${x}" y="60" text-anchor="${anchor}" font-size="9.5" fill="var(--faint)" font-family="inherit">${text}</text>`;
          }
          svg += '</svg>';
          chartEl.innerHTML = svg;
          chartEl.hidden = false;

          const total = amounts.reduce((sum, v) => sum + v, 0);
          const maxProb = Math.max(0, ...probs);
          if (total < 0.05) {
            captionEl.textContent =
              maxProb >= 20 ? `Dry for the next 12 h · up to ${maxProb}% chance` : 'Dry for the next 12 h';
          } else {
            captionEl.textContent = `${total.toFixed(1)} mm over the next 12 h`;
          }
        } catch (error) {
          chartEl.hidden = true;
          captionEl.textContent = '';
        }
      }

      async function loadWeather() {
        const nowEl = document.getElementById('weather-now');
        const rangeEl = document.getElementById('weather-range');
        try {
          const response = await fetch(WEATHER_URL);
          if (!response.ok) throw new Error();
          const data = await response.json();
          const temp = Math.round(data.current.temperature_2m);
          const condition = WMO_CODES[data.current.weather_code] || '';
          const high = Math.round(data.daily.temperature_2m_max[0]);
          const low = Math.round(data.daily.temperature_2m_min[0]);
          nowEl.classList.remove('unavailable');
          nowEl.innerHTML = `<span class="temp">${temp}°</span>${esc(condition)}`;
          rangeEl.textContent = `H ${high}° · L ${low}°`;
          renderRainChart(data);
        } catch (error) {
          nowEl.classList.add('unavailable');
          nowEl.textContent = 'Weather unavailable.';
          rangeEl.textContent = '';
          document.getElementById('rain-chart').hidden = true;
          document.getElementById('rain-caption').textContent = '';
        }
      }

      tickClock();
      setInterval(tickClock, 10 * 1000);
      loadWeather();
      setInterval(loadWeather, 30 * 60 * 1000);

      // ---------- login / init ----------

      document.getElementById('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const errorEl = document.getElementById('login-error');
        errorEl.textContent = '';
        try {
          await api('/api/login', {
            method: 'POST',
            body: JSON.stringify({ passphrase: document.getElementById('passphrase').value }),
          });
          document.getElementById('passphrase').value = '';
          init();
        } catch (error) {
          errorEl.textContent = error instanceof AuthError ? 'Wrong passphrase.' : error.message;
        }
      });

      document.getElementById('logout-btn').addEventListener('click', async () => {
        await api('/api/logout', { method: 'POST' }).catch(() => {});
        showLogin();
      });

      document.getElementById('refresh-btn').addEventListener('click', () => init(true));

      document.querySelectorAll('.win').forEach(setupWindow);
      document.querySelectorAll('.list-win').forEach(setupList);

      async function init(fresh = false) {
        try {
          statusEl.textContent = 'Loading…';
          const [repoData, listData, pinData, layoutData] = await Promise.all([
            api(`/api/repos${fresh ? '?fresh=1' : ''}`),
            api('/api/lists'),
            api('/api/pins'),
            api('/api/layout'),
          ]);
          repos = repoData.repos;
          tokenPresent = repoData.tokenPresent;
          lists = listData;
          pins = pinData;
          if (!fresh) layout = layoutData;
          showDesk();
          applyLayout();
          renderRepos();
          renderLists();
        } catch (error) {
          if (error instanceof AuthError) return;
          statusEl.textContent = error.message;
        }
      }

      init();
    </script>
  </body>
</html>
