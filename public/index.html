<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#d6dcdf" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#242a2d" media="(prefers-color-scheme: dark)">
  <title>ersatzben</title>
  <link rel="icon" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="masthead">
    <span class="identity">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 5.5h5v5h-5zM5.5 5.5H4a1.5 1.5 0 1 1 1.5-1.5zM10.5 5.5V4A1.5 1.5 0 1 1 12 5.5zM10.5 10.5H12a1.5 1.5 0 1 1-1.5 1.5zM5.5 10.5V12A1.5 1.5 0 1 1 4 10.5z"/></svg>
      ersatzben
    </span>
    <span class="clock"><time id="date"></time><span id="time"></span></span>
    <button id="logout" class="button" hidden>Lock</button>
  </header>

  <nav class="toolbar" aria-label="Shortcuts">
    <a href="https://mail.google.com/mail/u/0/#inbox">Gmail</a>
    <a href="https://outlook.office.com/mail/">Outlook</a>
    <a href="https://docs.google.com/document/u/0/">Docs</a>
    <a href="https://web.whatsapp.com/">WhatsApp</a>
    <a href="https://claude.ai/">Claude</a>
    <a href="https://chatgpt.com/">ChatGPT</a>
    <a href="https://bsky.app/">Bluesky</a>
    <a href="https://x.com/home">X</a>
    <a href="https://studio.youtube.com/">YouTube Studio</a>
  </nav>

  <section class="weather" aria-label="Weather in London">
    <div class="weather-row">
      <span class="now"><svg id="weather-icon" class="icon" viewBox="0 0 16 16" aria-hidden="true"></svg><span id="temp"></span></span>
      <p id="rain-summary">Loading forecast…</p>
      <span id="rain-chance"></span>
    </div>
    <details id="forecast" hidden>
      <summary>Show forecast</summary>
      <div id="rain-bars" class="bars" role="img"></div>
      <div id="rain-axis" class="axis" aria-hidden="true"></div>
    </details>
  </section>

  <main>
    <div class="column">
      <section class="window list" aria-labelledby="today-h">
        <h2 class="titlebar"><span id="today-h">Today</span><span class="count" id="today-count"></span></h2>
        <div class="content">
          <ul id="today" data-list="today"></ul>
          <form data-add="today"><input name="text" maxlength="1000" placeholder="One thing for today…" aria-label="Add to Today" autocomplete="off"></form>
          <button class="clear-done" data-clear="today" hidden>Clear completed</button>
        </div>
      </section>
      <section class="window list" aria-labelledby="later-h">
        <h2 class="titlebar"><span id="later-h">Later</span><span class="count" id="later-count"></span></h2>
        <div class="content">
          <ul id="later" data-list="later"></ul>
          <form data-add="later"><input name="text" maxlength="1000" placeholder="Something to get to…" aria-label="Add to Later" autocomplete="off"></form>
          <button class="clear-done" data-clear="later" hidden>Clear completed</button>
        </div>
      </section>
    </div>

    <section class="window repos" aria-labelledby="repos-h">
      <h2 class="titlebar"><span id="repos-h">Repositories</span><button id="refresh" hidden>Refresh</button></h2>
      <div class="content">
        <form id="login" hidden>
          <input id="passphrase" type="password" autocomplete="current-password" placeholder="Passphrase" aria-label="Passphrase" required>
          <button class="button">Unlock</button>
          <p id="login-error" role="alert"></p>
        </form>
        <input id="repo-search" type="search" placeholder="Find a repository…" aria-label="Find a repository" hidden>
        <p id="repo-status" role="status"></p>
        <ul id="repo-list"></ul>
      </div>
    </section>
  </main>

  <div id="toast" role="status" hidden></div>
</body>
</html>
